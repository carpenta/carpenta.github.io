<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Fairway Note v46 시안 — 또렷한 선, 각이 있는 모서리</title>
<!-- A design comparison (v46 step 0), never built or deployed. Serve the tool folder (bun run dev) and open
     /design/v46/. Three copies of the real app side by side: as it is (v45), and with two sets of token overrides
     injected into the page. The user's note: "조금 더 선이 깔끔하게 떨어지고 edge가 있었으면, 약간 유아틱한 느낌".
     Nothing is fetched; the app's own files and data only. What is round on purpose stays round: the hole ring, the
     score, the birdie and eagle circles, icon buttons, dots and the switch knob. -->
<style>
  body { margin: 0; padding: 20px 24px 32px; background: #1b1f1d; color: #e8ece9; font-family: system-ui, sans-serif; }
  html:lang(ko) body { word-break: keep-all; }
  header { display: flex; gap: 8px; align-items: center; margin-bottom: 16px; flex-wrap: wrap; }
  header strong { margin-right: 8px; }
  header button { font: inherit; font-size: 15px; padding: 8px 14px; border-radius: 6px; border: 1px solid #4a514d; background: #262b28; color: inherit; cursor: pointer; }
  header button[aria-pressed='true'] { background: #c4e04f; color: #102519; border-color: #c4e04f; }
  .row { display: flex; gap: 24px; align-items: flex-start; }
  figure { margin: 0; display: grid; gap: 10px; }
  figcaption { font-size: 16px; font-weight: 600; }
  figcaption small { display: block; margin-top: 3px; font-size: 13px; font-weight: 400; color: #aab3ad; }
  iframe { display: block; width: 390px; height: 844px; border: 0; background: #0f2118; }
</style>
</head>
<body>
<header>
  <strong>v46 시안: 또렷한 선과 각</strong>
  <button type="button" data-screen="entry">기록</button>
  <button type="button" data-screen="picker">코스 선택</button>
  <button type="button" data-screen="summary">라운드 요약</button>
</header>
<div class="row">
  <figure><iframe id="now" title="지금"></iframe><figcaption>지금 (v45)<small>알약 999px · 카드 24 · 칸 12 · 라임 선 1.5px과 빛 · 판에 라임 번짐</small></figcaption></figure>
  <figure><iframe id="a" title="A"></iframe><figcaption>A 또렷하게<small>버튼 12 · 카드 16 · 칸 8 · 라임 선 1px, 빛 없음 · 판은 1px 실선</small></figcaption></figure>
  <figure><iframe id="b" title="B"></iframe><figcaption>B 각지게<small>버튼 6 · 카드 10 · 칸 4 · 라임 선 1px, 빛 없음 · 판은 1px 실선</small></figcaption></figure>
</div>
<script type="module">
const VARIANTS = { now: null, a: { full: '12px', card: '16px', tile: '8px' }, b: { full: '6px', card: '10px', tile: '4px' } };

// Every chosen control and main action (style.css, v39–v42), and the panels that carry the faint lime halo.
const CHOSEN = `body :is(.btn.primary, .sum-actions .primary, .check-actions .primary, .sh-go, .vc-go, .next,
  .tchip[aria-pressed='true'], .dir[aria-pressed='true'], .club-lbl[aria-expanded='true'] .lbl-in, .edit.on,
  .picker-list .course[aria-pressed='true'], .pk-len button[aria-pressed='true'], .nine-pick button[aria-checked='true'],
  .np-row button[aria-pressed='true'], .sp-shots button[aria-pressed='true'], .sp-chip[aria-pressed='true'],
  .ct-col.cur .c-hole, .scell[aria-current='true'] .sc-no, .hole-nav .round.finish),
  body .picker :is(.btn.primary, .course[aria-pressed='true'], .pk-len button[aria-pressed='true'],
  .nine-pick button[aria-checked='true'], .chip[aria-pressed='true'])`;
const PANELS = '.sheet, .sheet-dialog, .hinfo, .numpick, .shot-panel, .sc-sheet, .box, .picker-list, .picker-foot';
const ROUND_PSEUDO = `.m[data-mark='birdie']::before, .m[data-mark='eagle']::before, .m[data-mark='eagle']::after,
  .badge.celebrate::after, .insights li::before, .sw::after, .tab[aria-selected='true']::after, .mi small.backup-old::before`;

const css = (v) => `
:root { --r-full: ${v.full}; --r-card: ${v.card}; --r-tile: ${v.tile}; --chosen-edge: 0 0 0 1px var(--lime); --lime-glow: transparent; }
[data-circle] { border-radius: 50% !important; }
${ROUND_PSEUDO} { border-radius: 50% !important; }
${CHOSEN} { box-shadow: inset 0 0 0 1px var(--lime) !important; }
${PANELS} { box-shadow: inset 0 0 0 1px rgb(255 255 255 / .1), 0 6px 16px rgb(0 0 0 / .28) !important; }
`;

const localDay = () => { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`; };
const EVERIS = [4, 4, 5, 3, 4, 4, 3, 5, 4, 4, 3, 4, 4, 5, 5, 3, 4, 4];
const MINE = [4, 4, 3, 5, 4, 4, 3, 5, 4, 5, 4, 3, 4, 4, 5, 3, 4, 4];
const hole = (par, played, extra = 0) => played
  ? { par, driver: 1, approach: par - 3 + extra, putts: 2, ob: 0, hazard: 0, mulligan: 0, bunker: 0 }
  : { par, driver: 0, approach: 0, putts: 0, ob: 0, hazard: 0, mulligan: 0, bunker: 0 };

// What each screen starts from: written before the three copies load, so they show the same thing.
function seed(screen) {
  localStorage.clear();
  const set = (k, v) => localStorage.setItem(k, JSON.stringify(v));
  if (screen === 'entry') {
    set('fairway-note:round:v1', { version: 1, date: localDay(), current: 4, lastEdited: Date.now(),
      course: { id: 'everis', name: '에버리스 골프리조트', front: '새별', back: '레이크' },
      holes: EVERIS.map((p, i) => hole(p, i < 4, i === 1 ? 1 : 0)) });
    set('fairway-note:prefs:v1', { course: 'everis', front: 'saebyul', back: 'lake' });
  } else if (screen === 'picker') {
    set('fairway-note:courses:v1', [{ id: 'my-x', name: '바닷가 퍼블릭', front: 'OUT', back: 'IN', par: MINE }]);
    set('fairway-note:prefs:v1', { course: null, front: '', back: '', name: '바닷가 퍼블릭', mine: 'my-x' });
  } else {
    set('fairway-note:round:v1', { version: 1, date: localDay(), current: 17, closed: true, lastEdited: Date.now(),
      course: { id: null, name: '동네 골프장', front: '', back: '' },
      holes: MINE.map((p, i) => hole(p, true, i % 5 === 0 ? 1 : 0)) });
    set('fairway-note:prefs:v1', { course: null, front: '', back: '', name: '동네 골프장' });
  }
}

const wait = (ms) => new Promise((r) => setTimeout(r, ms));
const loaded = (frame) => new Promise((r) => frame.addEventListener('load', () => r(), { once: true }));
const click = (doc, text) => [...doc.querySelectorAll('button')].find((b) => b.offsetParent && b.textContent.trim() === text)?.click();

/** Marks what is round on purpose (as wide as tall, its radius half its width) before the radius tokens change. */
function markCircles(doc) {
  for (const el of doc.querySelectorAll('body *')) {
    const r = el.getBoundingClientRect();
    if (r.width < 4 || Math.abs(r.width - r.height) > 2) continue;
    if (parseFloat(doc.defaultView.getComputedStyle(el).borderTopLeftRadius) >= r.width / 2 - 1) el.setAttribute('data-circle', '');
  }
}

async function show(screen) {
  for (const b of document.querySelectorAll('[data-screen]')) b.setAttribute('aria-pressed', String(b.dataset.screen === screen));
  seed(screen);
  for (const [id, v] of Object.entries(VARIANTS)) {
    const frame = document.getElementById(id);
    const ready = loaded(frame);
    frame.src = `/?v=${id}-${screen}-${Date.now()}`;
    await ready;
    await wait(900);
    const doc = frame.contentDocument;
    if (screen === 'summary') {
      [...doc.querySelectorAll('button')].find((b) => b.offsetParent && b.textContent.includes('스코어카드') && b.closest('nav'))?.click();
      await wait(300);
      click(doc, '라운드 마치기');
      await wait(400);
      click(doc, '그대로 마치기');
      await wait(700);
    }
    if (!v) continue;
    markCircles(doc);
    const sheet = new frame.contentWindow.CSSStyleSheet();
    sheet.replaceSync(css(v));
    doc.adoptedStyleSheets = [...doc.adoptedStyleSheets, sheet];
  }
}

for (const b of document.querySelectorAll('[data-screen]')) b.addEventListener('click', () => show(b.dataset.screen));
show(new URLSearchParams(location.search).get('screen') ?? 'entry');
</script>
</body>
</html>

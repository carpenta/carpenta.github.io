<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#3E6B2E">
<title>Fairway Note 홀 기록 시안 v4</title>
<style>
  :root {
    /* Grass tokens */
    --turf: #2F7D3A;
    --fairway: #5BAA4F;
    --rough: #3E6B2E;
    --putting: #8CCB6E;
    --ink: #17301A;
    --paper: #F3F7EF;
    --white: #FFFFFF;
    --red: #C0392B;
    --sand: #D9B45A;
    --deep: #16301D;
    --pill: #DCEBD5;

    /* Derived */
    --muted: #4E6450;          /* 6.4:1 on white */
    --tint: #EDF4E8;           /* resting fill: pad, penalty icons, toggle */
    --line: #D3E2CC;
    --off: #EEF3EB;            /* disabled fill */
    --off-ink: #8A9C88;        /* disabled glyph, 3:1 on --off */
    --sand-tint: #F7EBC9;
    --tab-ink: #A9C4A3;        /* 7.5:1 on --deep */
    --lift: 0 1px 2px rgba(23, 48, 26, 0.12), 0 4px 10px rgba(23, 48, 26, 0.14);
    --float: 0 2px 6px rgba(10, 30, 12, 0.22);

    --font: -apple-system, "Apple SD Gothic Neo", "Noto Sans KR", system-ui, sans-serif;
    --m: clamp(12px, 4.8vw, 22px);   /* sheet side margin: the course shows around it */
    --tabbar: 56px;
    --badge: 84px;
    --overlap: 26px;
    --sheet-pt: 30px;
    --pill-h: clamp(136px, calc(100dvh - 512px), 212px);
  }

  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
  html, body { margin: 0; height: 100%; }
  body { background: var(--rough); color: var(--ink); font-family: var(--font); overscroll-behavior: none; -webkit-font-smoothing: antialiased; }
  html:lang(ko) body { word-break: keep-all; }
  p, h1, h2, h3 { margin: 0; font: inherit; }
  a { color: inherit; text-decoration: none; }
  button {
    font: inherit; color: inherit; margin: 0; padding: 0; border: 0; background: none;
    cursor: pointer; touch-action: manipulation; -webkit-tap-highlight-color: transparent;
    -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
  }
  button[aria-disabled="true"] { cursor: default; }
  :focus-visible { outline: 3px solid var(--ink); outline-offset: 2px; }
  .sr { position: fixed; top: 0; left: 0; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
  svg { display: block; }

  /* Our own drawn hole fills the screen behind everything */
  .course { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 0; }

  .app {
    position: relative; z-index: 1; max-width: 480px; margin: 0 auto; height: 100dvh;
    display: flex; flex-direction: column;
    padding-bottom: calc(var(--tabbar) + env(safe-area-inset-bottom));
  }
  .view { flex: 1; min-height: 0; display: flex; flex-direction: column; }

  /* ---------- Top bar: light controls floating on the course ---------- */
  .top {
    flex: none; padding: max(8px, env(safe-area-inset-top)) var(--m) 0;
    display: grid; grid-template-columns: 48px 1fr 48px; row-gap: 14px; align-items: center;
  }
  .round {
    width: 48px; height: 48px; border-radius: 50%; display: grid; place-items: center;
    background: var(--white); color: var(--ink); box-shadow: var(--float);
  }
  .round:active { background: var(--tint); }
  .menu { grid-column: 1; grid-row: 1; }
  .switcher {
    grid-column: 2; grid-row: 1; justify-self: center;
    display: flex; align-items: center; gap: 6px; padding: 4px; border-radius: 999px;
    background: rgba(255, 255, 255, 0.96); box-shadow: var(--float);
  }
  .switcher .round { box-shadow: none; background: var(--tint); }
  .switcher .round:active { background: var(--pill); }
  .switcher .round[aria-disabled="true"] { background: transparent; color: var(--off-ink); }
  .hole-title { display: flex; align-items: center; gap: 3px; padding: 0 4px; font-weight: 800; white-space: nowrap; }
  .hole-title svg { flex: none; margin-right: 3px; }
  .hole-n { font-size: 34px; line-height: 1; font-variant-numeric: tabular-nums; letter-spacing: -0.02em; }
  .hole-u { font-size: 17px; font-weight: 700; padding-top: 6px; }
  .info { grid-column: 1 / -1; grid-row: 2; justify-self: center; display: flex; gap: 5px; }
  .chip {
    display: inline-flex; align-items: center; gap: 4px; height: 28px; padding: 0 8px; border-radius: 999px;
    background: rgba(255, 255, 255, 0.94); box-shadow: var(--float);
    font-size: 13px; font-weight: 700; color: var(--ink); white-space: nowrap; font-variant-numeric: tabular-nums;
  }
  .chip.link { position: relative; color: var(--turf); }
  .chip.link::after { content: ""; position: absolute; inset: -10px -2px; }  /* 48px tall touch area */
  .badge-room { flex: none; height: calc(var(--badge) - var(--overlap) + 4px); }

  /* ---------- The sheet ---------- */
  .spacer { flex: 1 1 0; min-height: 0; }
  .sheet-wrap { position: relative; flex: 0 1 auto; min-height: 0; margin: 0 var(--m); display: flex; flex-direction: column; }
  .sheet {
    flex: 0 1 auto; min-height: 0; overflow-y: auto; overscroll-behavior: contain;
    background: var(--white); border-radius: 32px; box-shadow: 0 12px 32px rgba(8, 28, 10, 0.32);
    padding: var(--sheet-pt) 18px 12px;
    scrollbar-width: none;
  }
  .sheet::-webkit-scrollbar { display: none; }
  /* A white fade at the bottom says there is more below; drawn over the sheet, so it adds no scroll. */
  .sheet-wrap::after {
    content: ""; position: absolute; z-index: 2; left: 0; right: 0; bottom: 0; height: 36px; border-radius: 0 0 32px 32px;
    background: linear-gradient(rgba(255, 255, 255, 0), #fff 85%); pointer-events: none; opacity: 0;
  }
  .sheet-wrap.more::after { opacity: 1; }

  /* Score badge: the computed hole score, overlapping the sheet's top right */
  .badge {
    position: absolute; z-index: 3; right: -6px; top: calc(var(--overlap) - var(--badge));
    width: var(--badge); height: var(--badge); border-radius: 50%;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;
    background: var(--deep); color: #fff;
    box-shadow: 0 0 0 4px var(--white), 0 8px 18px rgba(8, 28, 10, 0.35);
  }
  .badge[data-tone="under"] { background: var(--red); }
  .badge[data-tone="par"] { background: var(--turf); }
  .badge-cap { font-size: 13px; font-weight: 600; color: #CFE3C9; line-height: 1; }
  .badge[data-tone="under"] .badge-cap, .badge[data-tone="par"] .badge-cap { color: #fff; }
  .badge-name { font-size: 13px; font-weight: 700; line-height: 1; white-space: nowrap; }
  .bmark { position: relative; width: 44px; height: 36px; display: grid; place-items: center; }
  .bmark b { position: relative; font-size: 30px; font-weight: 800; line-height: 1; font-variant-numeric: tabular-nums; text-box: trim-both cap alphabetic; }
  .bmark.two b { font-size: 22px; }
  .bmark::before, .bmark::after { content: ""; position: absolute; inset: 0; margin: auto; width: 0; height: 0; border: 0 solid currentColor; }
  .bmark[data-mark="birdie"]::before { width: 34px; height: 34px; border-width: 2px; border-radius: 50%; }
  .bmark[data-mark="eagle"]::before { width: 29px; height: 29px; border-width: 1.5px; border-radius: 50%; }
  .bmark[data-mark="eagle"]::after { width: 36px; height: 36px; border-width: 1.5px; border-radius: 50%; }
  .bmark[data-mark="bogey"]::before { width: 32px; height: 32px; border-width: 2px; border-radius: 2px; }
  .bmark[data-mark="double"]::before { width: 28px; height: 28px; border-width: 1.5px; border-radius: 1px; }
  .bmark[data-mark="double"]::after { width: 35px; height: 35px; border-width: 1.5px; border-radius: 2px; }
  @keyframes settle { from { transform: scale(1.1); } to { transform: scale(1); } }
  .badge.settle { animation: settle 0.16s ease-out; }

  /* Row A: three tall pill steppers */
  .clubs { display: grid; grid-template-columns: repeat(3, 1fr); column-gap: 14px; }
  .club { display: flex; flex-direction: column; align-items: center; min-width: 0; }
  .club-lbl { display: flex; align-items: center; gap: 4px; height: 22px; margin-bottom: 8px; font-size: 15px; font-weight: 700; white-space: nowrap; }
  .club-lbl svg { color: var(--turf); }
  .pill {
    width: 100%; max-width: 104px; height: var(--pill-h); border-radius: 999px; background: var(--pill);
    display: flex; flex-direction: column; align-items: center; justify-content: space-between; padding: 7px 0;
  }
  .step { width: 100%; height: 52px; display: grid; place-items: center; border-radius: 26px; }
  .step span {
    width: 52px; height: 52px; border-radius: 50%; background: var(--white); color: var(--ink);
    display: grid; place-items: center; box-shadow: var(--lift);
  }
  .step:active span { background: var(--tint); box-shadow: 0 1px 2px rgba(23, 48, 26, 0.18); }
  .step[aria-disabled="true"] span { background: var(--off); color: var(--off-ink); box-shadow: none; }
  .count { font-size: clamp(40px, 7.2dvh, 54px); font-weight: 800; line-height: 1; font-variant-numeric: tabular-nums; text-box: trim-both cap alphabetic; }
  .count.zero { color: #6E856C; }
  @keyframes bump { 0% { transform: scale(1.16); } 100% { transform: scale(1); } }
  .count.bump { animation: bump 0.12s ease-out; }

  /* Row B (상세): tee-shot pad, miss-hit, divider, penalties */
  .detail { margin-top: 18px; }
  .row-title { display: flex; align-items: baseline; justify-content: center; gap: 8px; font-size: 17px; font-weight: 600; }
  .row-title .val { font-size: 15px; font-weight: 700; color: var(--turf); }
  .row-title .val.none { color: var(--muted); font-weight: 600; }
  .pad {
    margin: 10px auto 0; width: max-content;
    display: grid; grid-template-columns: 48px 48px 64px 48px 48px; grid-template-rows: 48px 64px 48px;
    column-gap: 8px; row-gap: 8px; align-items: center; justify-items: center;
  }
  .dir {
    width: 48px; height: 48px; border-radius: 50%; display: grid; place-items: center;
    background: var(--white); color: var(--ink); box-shadow: var(--lift);
  }
  .dir:active { background: var(--tint); }
  .dir[aria-pressed="true"] { background: var(--fairway); box-shadow: inset 0 0 0 2px var(--turf); }
  .dir.far { background: var(--tint); box-shadow: none; }
  .dir.far[aria-pressed="true"] { background: var(--fairway); box-shadow: inset 0 0 0 2px var(--turf); }
  .d-up { grid-area: 1 / 3; }
  .d-farl { grid-area: 2 / 1; }
  .d-l { grid-area: 2 / 2; }
  .d-c { grid-area: 2 / 3; width: 64px; height: 64px; font-size: 13px; font-weight: 800; background: #C9E5BF; box-shadow: var(--lift); }
  .d-r { grid-area: 2 / 4; }
  .d-farr { grid-area: 2 / 5; }
  .d-down { grid-area: 3 / 3; }
  .miss { margin-top: 14px; display: flex; align-items: center; justify-content: center; gap: 8px; }
  .miss-lbl { font-size: 13px; font-weight: 600; color: var(--muted); margin-right: 2px; }
  .toggle-pill {
    position: relative; height: 36px; padding: 0 14px; border-radius: 999px; display: inline-flex; align-items: center;
    background: var(--tint); font-size: 15px; font-weight: 700; color: var(--ink);
  }
  .toggle-pill::after { content: ""; position: absolute; inset: -6px 0; }  /* 48px touch area */
  .toggle-pill[aria-pressed="true"] { background: var(--fairway); }
  .divider { height: 1.5px; background: var(--line); margin: 18px 4px 6px; border: 0; }
  .pen-head { display: flex; align-items: center; justify-content: space-between; min-height: 48px; margin-bottom: 8px; }

  .pens { display: flex; align-items: flex-start; justify-content: center; gap: 24px; }
  /* 기본: OB and 해저드 stay centred; "빼기" appears in its own slot to the right, so nothing moves. */
  .pens.basic { display: grid; grid-template-columns: 1fr 72px 72px 1fr; column-gap: 24px; margin-top: 16px; }
  .pens.basic .pen[data-pen="ob"] { grid-column: 2; }
  .pens.basic .pen[data-pen="hazard"] { grid-column: 3; }
  .pen { position: relative; width: 72px; display: flex; flex-direction: column; align-items: center; gap: 6px; }
  .pen-icon {
    position: relative; width: 52px; height: 52px; border-radius: 50%; display: grid; place-items: center;
    background: var(--tint); box-shadow: inset 0 0 0 1.5px transparent;
  }
  .pen:active .pen-icon { background: var(--pill); }
  .pen.on .pen-icon { background: var(--sand-tint); box-shadow: inset 0 0 0 2px var(--sand); }
  .pen-lbl { font-size: 13px; font-weight: 700; line-height: 16px; text-align: center; white-space: nowrap; }
  .pen-count {
    position: absolute; top: -4px; right: -6px; min-width: 24px; height: 24px; padding: 0 6px; border-radius: 999px;
    background: var(--sand); color: var(--ink); font-size: 13px; font-weight: 800; line-height: 24px; text-align: center;
    box-shadow: 0 0 0 2px var(--white); font-variant-numeric: tabular-nums;
  }
  .undo {
    min-height: 48px; padding: 0 12px; border-radius: 999px; font-size: 13px; font-weight: 700; color: var(--turf);
    display: inline-flex; align-items: center; gap: 4px; white-space: nowrap;
  }
  .undo:active { background: var(--tint); }
  .pens.basic .undo {
    grid-column: 4; justify-self: start; margin-left: -16px; min-width: 48px; padding: 0 6px;
    flex-direction: column; justify-content: flex-start; gap: 6px; font-size: 13px; line-height: 16px;
  }
  .pens.basic .undo .u-ico {
    width: 52px; height: 52px; border-radius: 50%; display: grid; place-items: center;
    background: var(--white); color: var(--ink); box-shadow: var(--lift);
  }

  /* 기본 / 상세 */
  .modes { display: flex; justify-content: center; gap: 8px; margin-top: 12px; }
  .mode {
    position: relative; height: 40px; min-width: 96px; padding: 0 18px; border-radius: 999px;
    background: var(--tint); color: var(--muted); font-size: 15px; font-weight: 700;
  }
  .mode::after { content: ""; position: absolute; inset: -4px 0; }
  .mode[aria-pressed="true"] { background: var(--fairway); color: var(--ink); }

  .next {
    flex: none; margin: 8px var(--m) 8px; height: 52px; border-radius: 999px;
    background: var(--turf); color: #fff; font-size: 17px; font-weight: 700; box-shadow: var(--float);
  }
  .next:active { background: #276B31; }

  /* ---------- Bottom tab bar ---------- */
  .tabbar {
    position: fixed; z-index: 5; left: 0; right: 0; bottom: 0;
    padding: 0 max(12px, env(safe-area-inset-right)) env(safe-area-inset-bottom) max(12px, env(safe-area-inset-left));
    background: var(--deep); display: flex; justify-content: center;
  }
  .tabs { position: relative; display: grid; grid-template-columns: repeat(2, 112px); width: 100%; max-width: 480px; justify-content: center; column-gap: 12px; }
  .tab {
    height: var(--tabbar); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;
    color: var(--tab-ink); font-size: 13px; font-weight: 600;
  }
  .tab svg { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .tab[aria-selected="true"] { color: var(--fairway); font-weight: 700; }
  .ver {
    position: absolute; right: 0; top: 50%; transform: translateY(-50%);
    font-size: 13px; font-weight: 600; color: var(--tab-ink); padding: 2px 8px; border-radius: 999px; box-shadow: inset 0 0 0 1px #3A5A40;
  }

  /* ---------- Scorecard ---------- */
  .sc { --m: 10px; background: var(--paper); overflow-y: auto; scrollbar-width: none; }
  .sc::-webkit-scrollbar { display: none; }
  .sc-top { flex: none; display: grid; grid-template-columns: 48px 1fr 48px; align-items: center; padding: max(8px, env(safe-area-inset-top)) var(--m) 10px; }
  .sc-top .round { box-shadow: var(--float); }
  .sc-title { text-align: center; }
  .sc-title h2 { font-size: 17px; font-weight: 700; }
  .sc-title p { font-size: 13px; color: var(--muted); margin-top: 2px; }
  .sc-sheet { flex: none; margin: 0 var(--m) 12px; background: var(--white); border-radius: 32px; padding: 14px 10px 16px; box-shadow: 0 8px 24px rgba(23, 48, 26, 0.12); }
  .sum { display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px; margin: 0; padding: 4px 0 14px; border-bottom: 1.5px solid var(--line); }
  .sum div { text-align: center; }
  .sum dt { font-size: 13px; color: var(--muted); }
  .sum dd { margin: 2px 0 0; font-size: 22px; font-weight: 800; font-variant-numeric: tabular-nums; }
  .sum dd.under { color: var(--red); }
  .nine-h { display: flex; justify-content: space-between; align-items: baseline; margin: 14px 2px 8px; }
  .nine-h h3 { font-size: 17px; font-weight: 600; }
  .nine-h span { font-size: 13px; color: var(--muted); }
  .tbl { display: grid; grid-template-columns: 28px repeat(5, 1fr); column-gap: 8px; }
  .tbl + .tbl { margin-top: 8px; }
  .rowlbl { display: flex; flex-direction: column; }
  .rowlbl span, .col > span { height: 24px; display: grid; place-items: center; font-size: 13px; }
  .rowlbl span { justify-items: start; color: var(--muted); font-weight: 600; }
  .rowlbl span.sc-row, .col > span.sc-row { height: 42px; }
  .col { display: flex; flex-direction: column; border-radius: 12px; min-width: 0; overflow: hidden; background: var(--white); box-shadow: inset 0 0 0 1px var(--line); }
  button.col:active { background: var(--tint); }
  .col .no { font-weight: 800; background: var(--pill); }
  .col .pr { color: var(--muted); }
  .col .pt { color: var(--ink); }
  .col.sub { background: var(--paper); box-shadow: none; }
  .col.sub .no { background: var(--line); }
  .col[aria-current="true"] { box-shadow: inset 0 0 0 2.5px var(--turf); }
  .col[aria-current="true"] .no { background: var(--turf); color: #fff; }
  .sub-v { font-size: 17px; font-weight: 800; font-variant-numeric: tabular-nums; }
  .m { position: relative; width: 34px; height: 34px; display: grid; place-items: center; color: var(--ink); }
  .m[data-tone="under"] { color: var(--red); }
  .m[data-tone="par"] { color: var(--turf); }
  .m[data-tone="none"] { color: #93A691; }
  .m b { position: relative; font-size: 20px; font-weight: 800; line-height: 1; font-variant-numeric: tabular-nums; text-box: trim-both cap alphabetic; }
  .m::before, .m::after { content: ""; position: absolute; inset: 0; margin: auto; width: 0; height: 0; border: 0 solid currentColor; }
  .m[data-mark="birdie"]::before { width: 29px; height: 29px; border-width: 2px; border-radius: 50%; }
  .m[data-mark="eagle"]::before { width: 25px; height: 25px; border-width: 1.5px; border-radius: 50%; }
  .m[data-mark="eagle"]::after { width: 32px; height: 32px; border-width: 1.5px; border-radius: 50%; }
  .m[data-mark="bogey"]::before { width: 27px; height: 27px; border-width: 2px; border-radius: 2px; }
  .m[data-mark="double"]::before { width: 24px; height: 24px; border-width: 1.5px; border-radius: 1px; }
  .m[data-mark="double"]::after { width: 31px; height: 31px; border-width: 1.5px; border-radius: 2px; }
  .tot { display: flex; align-items: baseline; gap: 10px; margin-top: 14px; padding-top: 12px; border-top: 1.5px solid var(--line); }
  .tot h3 { font-size: 17px; font-weight: 600; }
  .tot span { font-size: 13px; color: var(--muted); }
  .tot b { margin-left: auto; font-size: 22px; font-weight: 800; font-variant-numeric: tabular-nums; }
  .tot b + b { margin-left: 8px; min-width: 52px; text-align: right; }
  .tot b.under { color: var(--red); }
  .lost { flex: none; margin: 0 var(--m) 20px; background: var(--white); border-radius: 24px; padding: 16px; box-shadow: 0 8px 24px rgba(23, 48, 26, 0.10); }
  .lost h3 { font-size: 17px; font-weight: 600; }
  .lost p { font-size: 13px; color: var(--muted); margin-top: 4px; }
  .bars { list-style: none; margin: 12px 0 0; padding: 0; display: grid; gap: 8px; }
  .bars li { display: grid; grid-template-columns: 64px 1fr 32px; align-items: center; gap: 8px; font-size: 13px; }
  .bars .bar { height: 10px; border-radius: 4px; background: var(--off); overflow: hidden; }
  .bars .bar i { display: block; height: 100%; border-radius: 4px; background: var(--turf); }
  .bars li.worst .bar i { background: var(--sand); }
  .bars .v { text-align: right; font-weight: 800; font-variant-numeric: tabular-nums; }

  /* ---------- Menu sheet ---------- */
  .scrim { position: fixed; inset: 0; z-index: 8; background: rgba(8, 24, 10, 0.45); }
  .menu-sheet {
    position: fixed; z-index: 9; left: 0; right: 0; bottom: 0; max-width: 480px; margin: 0 auto;
    background: var(--white); border-radius: 28px 28px 0 0; padding: 10px 20px calc(20px + env(safe-area-inset-bottom));
  }
  .grab { width: 40px; height: 5px; border-radius: 3px; background: var(--line); margin: 0 auto 12px; }
  .menu-sheet h2 { font-size: 17px; font-weight: 700; }
  .menu-sheet dl { margin: 12px 0 0; display: grid; grid-template-columns: auto 1fr; gap: 10px 16px; font-size: 15px; }
  .menu-sheet dt { color: var(--muted); }
  .menu-sheet dd { margin: 0; font-weight: 600; }
  .menu-close { margin-top: 18px; width: 100%; height: 52px; border-radius: 999px; background: var(--tint); font-size: 17px; font-weight: 700; }

  /* Shorter screens (iPhone SE Safari, 360x640): the header packs left so the badge sits beside it */
  @media (max-height: 650px) {
    :root { --badge: 72px; --overlap: 12px; --sheet-pt: 16px; --pill-h: clamp(128px, calc(100dvh - 422px), 176px); }
    .top { grid-template-columns: 48px auto 1fr; column-gap: 8px; }

  }

</style>

<script>
(() => {
  'use strict';

  // 에버리스 새별 (1-9) then 레이크 (10-18), from tools/fairway-note/src/round.ts
  const PARS = [4, 4, 5, 3, 4, 4, 3, 5, 4, 4, 3, 4, 4, 5, 5, 3, 4, 4];
  // Official lengths for 새별 1-5 (metres; the tee is not named on the table). Unknown for the rest.
  const LENGTHS = [381, 376, 529, 151, 341];
  const MAX = 15;
  const MINUS = '−';
  const CLUBS = ['driver', 'approach', 'putts'];
  const PENS = {
    ob: { label: 'OB', stroke: true },
    hazard: { label: '해저드', stroke: true },
    bunker: { label: '벙커', stroke: false },
  };
  const DIRS = { fairway: '페어웨이', left: '좌', right: '우', farLeft: '많이 좌', farRight: '많이 우', long: '김', short: '짧음' };

  const state = {
    view: 'entry',
    mode: 'basic',
    cur: 0,
    holes: PARS.map((par, i) => ({
      par, len: LENGTHS[i] ?? null,
      driver: 0, approach: 0, putts: 0, ob: 0, hazard: 0, bunker: 0,
      tee: null, whiff: false, fat: false, stack: [],
    })),
  };

  const $ = (s) => document.querySelector(s);
  const $$ = (s) => [...document.querySelectorAll(s)];

  // The score is computed: every swing of the three clubs plus OB and 해저드 strokes.
  const strokes = (h) => h.driver + h.approach + h.putts + h.ob + h.hazard;
  // As in round.ts: a hole is finished once holed (a putt) or left for another hole.
  const finished = (i) => strokes(state.holes[i]) > 0 && (state.holes[i].putts > 0 || i !== state.cur);
  const tone = (d) => (d < 0 ? 'under' : d === 0 ? 'par' : 'over');
  const markOf = (d) => (d <= -2 ? 'eagle' : d === -1 ? 'birdie' : d === 0 ? 'par' : d === 1 ? 'bogey' : 'double');
  const fmt = (n) => (n === 0 ? '이븐' : n > 0 ? `+${n}` : `${MINUS}${-n}`);
  function nameOf(h) {
    const s = strokes(h);
    const d = s - h.par;
    if (s === 1) return '홀인원';
    if (d <= -3) return '알바트로스';
    const names = { '-2': '이글', '-1': '버디', 0: '파', 1: '보기', 2: '더블 보기', 3: '트리플 보기', 4: '쿼드러플' };
    return names[d] ?? `+${d}`;
  }

  function totals(from = 0, to = PARS.length) {
    const t = { holes: 0, strokes: 0, par: 0, putts: 0, ob: 0, hazard: 0, lost: { driver: 0, approach: 0, putts: 0, penalty: 0 } };
    for (let i = from; i < to; i++) {
      if (!finished(i)) continue;
      const h = state.holes[i];
      t.holes += 1; t.strokes += strokes(h); t.par += h.par; t.putts += h.putts; t.ob += h.ob; t.hazard += h.hazard;
      t.lost.driver += Math.max(0, h.driver - 1);
      t.lost.approach += Math.max(0, h.approach - (h.par - 3));
      t.lost.putts += Math.max(0, h.putts - 2);
      t.lost.penalty += h.ob + h.hazard;
    }
    t.toPar = t.strokes - t.par;
    return t;
  }

  /* ---------- The drawn course: our own plan of the hole, tee at the bottom, green at the top ---------- */
  // Per-hole variety without inventing features: where the pin sits and the outline of the green.
  const PIN = [[0.3, -0.1], [-0.32, 0.05], [0.12, -0.2], [0.36, 0.1], [-0.3, -0.12], [0.24, 0.12], [-0.2, -0.1], [0.3, 0.05], [-0.26, -0.15],
    [0.2, 0.1], [-0.34, 0], [0.28, -0.12], [-0.14, 0.12], [0.32, -0.05], [-0.22, 0.1], [0.3, -0.1], [-0.3, 0.06], [0.16, -0.1]];
  const GREEN = [[1, 0.92, 1.06, 0.95, 1.02, 0.9, 1.04, 0.97], [0.95, 1.05, 0.92, 1.04, 0.97, 1.06, 0.9, 1.02], [1.04, 0.9, 1.02, 0.96, 1.07, 0.93, 0.98, 1.03]];

  function smooth(pts) {
    const n = pts.length;
    let d = `M${pts[0][0].toFixed(1)} ${pts[0][1].toFixed(1)}`;
    for (let i = 0; i < n; i++) {
      const p0 = pts[(i - 1 + n) % n], p1 = pts[i], p2 = pts[(i + 1) % n], p3 = pts[(i + 2) % n];
      d += ` C${(p1[0] + (p2[0] - p0[0]) / 6).toFixed(1)} ${(p1[1] + (p2[1] - p0[1]) / 6).toFixed(1)} ${(p2[0] - (p3[0] - p1[0]) / 6).toFixed(1)} ${(p2[1] - (p3[1] - p1[1]) / 6).toFixed(1)} ${p2[0].toFixed(1)} ${p2[1].toFixed(1)}`;
    }
    return `${d}Z`;
  }

  function drawCourse() {
    const svg = $('#course');
    const W = window.innerWidth;
    const H = window.innerHeight;
    const i = state.cur;
    const h = state.holes[i];
    const k = h.par === 3 ? 0 : h.par === 4 ? 1 : 2;

    // Where the hole can be seen: the open band between the info line and the sheet, left of the badge.
    let bandTop = 110;
    let bandBottom = 168;
    let right = W * 0.72;
    if (state.view === 'entry') {
      bandTop = $('.info').getBoundingClientRect().bottom + 6;
      bandBottom = $('#sheet').getBoundingClientRect().top;
      right = $('#badge').getBoundingClientRect().left - 6;
    }
    const band = bandBottom - bandTop;

    const gR = W * [0.27, 0.2, 0.165][k];
    const gRy = gR * 0.66;
    const gx = Math.min(W * 0.47, right - gR * 0.75);
    // The pin and flag stand in the open band; the green tucks under the sheet's edge.
    const pinY = band > 40 ? bandBottom - 10 : bandBottom - 4;
    const pole = Math.max(18, Math.min([40, 34, 30][k], band - 16));
    const gy = pinY + gRy * 0.18;
    const pinX = gx + gR * PIN[i][0];
    const teeY = H - [64, 56, 52][k];
    const tx = W / 2;

    const p = [];
    p.push(`<defs>
      <radialGradient id="rough" cx="50%" cy="46%" r="75%"><stop offset="0" stop-color="#4A7B37"/><stop offset="0.6" stop-color="#3E6B2E"/><stop offset="1" stop-color="#335A27"/></radialGradient>
      <pattern id="mow" width="40" height="40" patternUnits="userSpaceOnUse" patternTransform="rotate(-24)"><rect width="20" height="40" fill="#66B35A"/></pattern>
      <radialGradient id="dome" cx="42%" cy="38%" r="70%"><stop offset="0" stop-color="#9ED583"/><stop offset="1" stop-color="#8CCB6E"/></radialGradient>
    </defs>`);
    p.push(`<rect width="${W}" height="${H}" fill="url(#rough)"/>`);

    if (k > 0) {
      // A straight fairway from in front of the tee to in front of the green; a par 5 has two landing areas.
      const prof = k === 1 ? [0.15, 0.22, 0.33, 0.43, 0.5, 0.52, 0.44] : [0.12, 0.18, 0.27, 0.23, 0.35, 0.48, 0.42];
      const ts = [0, 0.12, 0.3, 0.5, 0.7, 0.88, 1];
      const y0 = gy + gRy * 0.7;
      const y1 = teeY - 36;
      const at = (t) => [gx + (tx - gx) * t, y0 + (y1 - y0) * t];
      const rightSide = ts.map((t, j) => { const [x, y] = at(t); return [x + W * prof[j], y]; });
      const leftSide = ts.map((t, j) => { const [x, y] = at(t); return [x - W * prof[j], y]; }).reverse();
      const top = at(0);
      const bot = at(1);
      const pts = [[top[0], top[1] - gRy * 0.25], ...rightSide, [bot[0], bot[1] + 14], ...leftSide];
      const fw = smooth(pts);
      p.push(`<path d="${fw}" fill="none" stroke="#4C8A3E" stroke-width="14" stroke-linejoin="round"/>`);
      p.push(`<path d="${fw}" fill="#5BAA4F"/>`);
      p.push(`<path d="${fw}" fill="url(#mow)"/>`);
    }

    // Green: fringe, putting surface, cup, flag and its shadow
    const g = GREEN[i % 3];
    const ring = (s) => g.map((r, j) => { const a = (j / g.length) * Math.PI * 2; return [gx + Math.cos(a) * gR * r * s, gy + Math.sin(a) * gRy * r * s]; });
    p.push(`<path d="${smooth(ring(1.14))}" fill="#74B95E"/>`);
    p.push(`<path d="${smooth(ring(1))}" fill="url(#dome)"/>`);
    // The flag is drawn only where it can be seen whole; on short screens the green tucks under the header.
    if (band >= 30) {
      p.push(`<path d="M${pinX} ${pinY} l ${pole * 0.55} ${pole * 0.2}" stroke="#5E9B4C" stroke-width="2.5" stroke-linecap="round"/>`);
      p.push(`<ellipse cx="${pinX}" cy="${pinY}" rx="3.4" ry="1.8" fill="#17301A"/>`);
      p.push(`<path d="M${pinX} ${pinY} V ${pinY - pole}" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"/>`);
      p.push(`<path d="M${pinX + 1} ${pinY - pole} l ${Math.max(12, pole * 0.42)} ${pole * 0.15} l ${-Math.max(12, pole * 0.42)} ${pole * 0.15} z" fill="#C0392B"/>`);
    }

    // Tee box with two markers
    const tw = W * [0.3, 0.26, 0.24][k];
    p.push(`<rect x="${tx - tw / 2}" y="${teeY - 12}" width="${tw}" height="24" rx="9" fill="#8CCB6E" stroke="#74B95E" stroke-width="2"/>`);
    p.push(`<circle cx="${tx - tw * 0.3}" cy="${teeY - 3}" r="4" fill="#FFFFFF"/><circle cx="${tx + tw * 0.3}" cy="${teeY - 3}" r="4" fill="#FFFFFF"/>`);

    svg.setAttribute('viewBox', `0 0 ${W} ${H}`);
    svg.setAttribute('width', W);
    svg.setAttribute('height', H);
    svg.innerHTML = p.join('');
  }

  /* ---------- Penalty buttons ---------- */
  const ICONS = {
    ob: '<svg viewBox="0 0 24 32" width="20" height="28" aria-hidden="true"><path d="M8 2h8v20l-4 7-4-7z" fill="#fff" stroke="#17301A" stroke-width="1.6" stroke-linejoin="round"/><path d="M8 6.5h8v4.5H8z" fill="#17301A"/></svg>',
    hazard: '<svg viewBox="0 0 24 32" width="20" height="28" aria-hidden="true"><path d="M8 2h8v20l-4 7-4-7z" fill="#C0392B" stroke="#8C2A20" stroke-width="1.6" stroke-linejoin="round"/></svg>',
    // A ball sitting in a sand bowl, with the grass lip behind it
    bunker: '<svg viewBox="0 0 30 24" width="28" height="22" aria-hidden="true"><path d="M3 11.5c3.5-3 20.5-3 24 0" fill="none" stroke="#5BAA4F" stroke-width="2.4" stroke-linecap="round"/><path d="M3.5 12c1.2 5.2 5.6 8 11.5 8s10.3-2.8 11.5-8c-3.6 1.6-19.4 1.6-23 0z" fill="#E7CE8A" stroke="#B8923A" stroke-width="1.4" stroke-linejoin="round"/><circle cx="15" cy="12.2" r="3.4" fill="#fff" stroke="#17301A" stroke-width="1.3"/><circle cx="9" cy="16" r="0.9" fill="#B8923A"/><circle cx="21" cy="16.2" r="0.9" fill="#B8923A"/></svg>',
  };
  function penHTML(k) {
    return `<button class="pen" type="button" data-pen="${k}"><span class="pen-icon">${ICONS[k]}<span class="pen-count" hidden></span></span><span class="pen-lbl">${PENS[k].label}</span></button>`;
  }
  $('#pens-basic').innerHTML = penHTML('ob') + penHTML('hazard') + '<button class="undo" type="button" data-act="undo" id="undo-basic" hidden></button>';
  $('#pens-detail').innerHTML = penHTML('hazard') + penHTML('ob') + penHTML('bunker');

  /* ---------- Render ---------- */
  let lastMark = null;

  function setDisabled(el, off) { el.setAttribute('aria-disabled', off ? 'true' : 'false'); }
  function say(t) { const l = $('#live'); l.textContent = ''; requestAnimationFrame(() => { l.textContent = t; }); }

  function renderEntry(changed) {
    const i = state.cur;
    const h = state.holes[i];
    $('#hole-n').textContent = String(i + 1);
    $('#par').textContent = `Par ${h.par}`;
    const len = $('#len');
    len.hidden = h.len === null;
    if (h.len !== null) len.textContent = `${h.len} m`;
    setDisabled($('#prev'), i === 0);
    setDisabled($('#fwd'), i === PARS.length - 1);

    for (const c of CLUBS) {
      const el = $(`#c-${c}`);
      const before = el.textContent;
      el.textContent = String(h[c]);
      el.classList.toggle('zero', h[c] === 0);
      if (changed === c && before !== el.textContent) { el.classList.remove('bump'); void el.offsetWidth; el.classList.add('bump'); }
      setDisabled($(`[data-sub="${c}"]`), h[c] === 0);
      setDisabled($(`[data-add="${c}"]`), strokes(h) >= MAX);
    }

    // The badge: the computed hole score and its scorecard mark
    const s = strokes(h);
    const badge = $('#badge');
    const bm = $('#bmark');
    let mark = 'none';
    let t = 'none';
    let name = '기록 전';
    if (s > 0 && finished(i)) {
      const d = s - h.par;
      mark = markOf(d); t = tone(d); name = nameOf(h);
    } else if (s > 0) {
      name = '진행 중';
    }
    $('#b-n').textContent = s > 0 ? String(s) : '–';
    bm.dataset.mark = mark;
    bm.classList.toggle('two', s >= 10);
    badge.dataset.tone = t;
    $('#b-name').textContent = name;
    badge.setAttribute('role', 'img');
    badge.setAttribute('aria-label', s > 0 ? `이 홀 ${s}타, ${name}` : '이 홀 아직 기록 전');
    const key = `${i}:${mark}`;
    if (changed && lastMark !== null && lastMark !== key && mark !== 'none') { badge.classList.remove('settle'); void badge.offsetWidth; badge.classList.add('settle'); }
    lastMark = key;

    // 기본 / 상세
    const detail = state.mode === 'detail';
    $('#sheet').dataset.mode = state.mode;
    $('#detail').hidden = !detail;
    $('#pens-basic').hidden = detail;
    for (const b of $$('[data-mode]')) b.setAttribute('aria-pressed', String(b.dataset.mode === state.mode));

    // Tee-shot pad
    const green = h.par === 3;
    $('#center-lbl').textContent = green ? '온그린' : '페어웨이';
    for (const b of $$('[data-dir]')) b.setAttribute('aria-pressed', String(h.tee === b.dataset.dir));
    const tv = $('#tee-val');
    tv.textContent = h.tee ? (h.tee === 'fairway' && green ? '온그린' : DIRS[h.tee]) : '선택 안 함';
    tv.classList.toggle('none', !h.tee);
    for (const b of $$('[data-miss]')) b.setAttribute('aria-pressed', String(h[b.dataset.miss]));

    // Penalties
    for (const b of $$('[data-pen]')) {
      const k = b.dataset.pen;
      const n = h[k];
      b.classList.toggle('on', n > 0);
      const c = b.querySelector('.pen-count');
      c.hidden = n === 0;
      c.textContent = String(n);
      b.setAttribute('aria-label', `${PENS[k].label} ${PENS[k].stroke ? '벌타 ' : ''}추가, 지금 ${n}`);
      setDisabled(b, PENS[k].stroke && s >= MAX);
    }
    const last = h.stack[h.stack.length - 1];
    for (const u of [$('#undo-basic'), $('#undo-detail')]) {
      u.hidden = !last || (u.id === 'undo-basic' && last === 'bunker');
      if (last) {
        const minus = `<svg viewBox="0 0 24 24" width="${u.id === 'undo-basic' ? 22 : 16}" height="${u.id === 'undo-basic' ? 22 : 16}" aria-hidden="true"><path d="M5 12h14" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg>`;
        u.innerHTML = u.id === 'undo-basic'
          ? `<span class="u-ico">${minus}</span><span>${PENS[last].label} 빼기</span>`
          : `${minus}${PENS[last].label} 빼기`;
        u.setAttribute('aria-label', `${PENS[last].label} 하나 빼기`);
      }
    }

    $('#next').textContent = i === PARS.length - 1 ? '라운드 마치기' : '다음 홀';
    requestAnimationFrame(scrollHint);
  }

  function scrollHint() {
    const s = $('#sheet');
    $('.sheet-wrap').classList.toggle('more', s.scrollHeight - s.clientHeight - s.scrollTop > 4);
  }

  function cellsHTML(from, to, sub) {
    let out = '<div class="rowlbl" aria-hidden="true"><span>홀</span><span>파</span><span class="sc-row">타수</span><span>퍼트</span></div>';
    for (let i = from; i < to; i++) out += `<button class="col" type="button" data-open="${i}"><span class="no">${i + 1}</span><span class="pr">${PARS[i]}</span><span class="sc-row"><span class="m"><b></b></span></span><span class="pt"></span></button>`;
    if (sub) out += `<div class="col sub" id="sub-${sub}"><span class="no">${sub === 'out' ? '전반' : '후반'}</span><span class="pr"></span><span class="sc-row"><b class="sub-v"></b></span><span class="pt"></span></div>`;
    return out;
  }
  $('#t0').innerHTML = cellsHTML(0, 5);
  $('#t1').innerHTML = cellsHTML(5, 9, 'out');
  $('#t2').innerHTML = cellsHTML(9, 14);
  $('#t3').innerHTML = cellsHTML(14, 18, 'in');

  function renderCard() {
    const d = new Date();
    $('#sc-date').textContent = `에버리스 ${d.getMonth() + 1}월 ${d.getDate()}일`;
    const t = totals();
    $('#s-strokes').textContent = String(t.strokes);
    const tp = $('#s-topar');
    tp.textContent = fmt(t.toPar);
    tp.classList.toggle('under', t.toPar < 0);
    $('#s-putts').textContent = String(t.putts);
    $('#s-ob').textContent = String(t.ob);
    $('#s-hz').textContent = String(t.hazard);
    for (const c of $$('[data-open]')) {
      const i = Number(c.dataset.open);
      const h = state.holes[i];
      const done = finished(i);
      const m = c.querySelector('.m');
      const dd = strokes(h) - h.par;
      m.dataset.mark = done ? markOf(dd) : 'none';
      m.dataset.tone = done ? tone(dd) : 'none';
      m.querySelector('b').textContent = done ? String(strokes(h)) : '–';
      c.querySelector('.pt').textContent = done ? String(h.putts) : '';
      c.setAttribute('aria-current', String(i === state.cur));
      c.setAttribute('aria-label', done ? `${i + 1}번 홀 파 ${h.par}, ${strokes(h)}타 ${nameOf(h)}, 퍼트 ${h.putts}` : `${i + 1}번 홀 파 ${h.par}, 기록 없음`);
    }
    for (const [id, a, b] of [['out', 0, 9], ['in', 9, 18]]) {
      const s = totals(a, b);
      const el = $(`#sub-${id}`);
      el.querySelector('.pr').textContent = String(PARS.slice(a, b).reduce((x, y) => x + y, 0));
      el.querySelector('.sub-v').textContent = s.holes ? String(s.strokes) : '–';
      el.querySelector('.pt').textContent = s.holes ? String(s.putts) : '';
    }
    $('#tot-holes').textContent = `${t.holes}홀`;
    $('#tot-strokes').textContent = `${t.strokes}타`;
    const tt = $('#tot-topar');
    tt.textContent = fmt(t.toPar);
    tt.classList.toggle('under', t.toPar < 0);

    const areas = [['driver', '티샷'], ['approach', '어프로치'], ['putts', '퍼트'], ['penalty', '벌타']];
    const most = Math.max(...areas.map(([k]) => t.lost[k]));
    const worst = areas.filter(([k]) => most > 0 && t.lost[k] === most).map(([, l]) => l);
    $('#lost-note').textContent = !t.holes ? '홀을 기록하면 보여요.' : worst.length ? `${worst.join(', ')}에서 가장 많이 잃었어요. 티샷 1번, 퍼트 2번을 기준으로 셌어요.` : '잃은 타수가 없어요.';
    const scale = Math.max(most, 3);
    $('#bars').innerHTML = areas.map(([k, l]) => {
      const v = t.lost[k];
      return `<li class="${most > 0 && v === most ? 'worst' : ''}"><span>${l}</span><span class="bar"><i style="width:${(v / scale) * 100}%"></i></span><span class="v">+${v}</span></li>`;
    }).join('');
  }

  function render(changed) {
    $('#view-entry').hidden = state.view !== 'entry';
    $('#view-card').hidden = state.view !== 'card';
    for (const tb of $$('[role="tab"]')) {
      const on = tb.dataset.view === state.view;
      tb.setAttribute('aria-selected', String(on));
      tb.tabIndex = on ? 0 : -1;
    }
    if (state.view === 'entry') renderEntry(changed);
    else renderCard();
    drawCourse();
  }

  /* ---------- Actions ---------- */
  function edit(fn, changed) {
    const h = state.holes[state.cur];
    if (fn(h) === false) return;
    render(changed);
    say(`${strokes(h)}타. 드라이버 ${h.driver}, 어프로치 ${h.approach}, 퍼터 ${h.putts}${h.ob ? `, OB ${h.ob}` : ''}${h.hazard ? `, 해저드 ${h.hazard}` : ''}`);
  }

  function goTo(i) {
    state.cur = i;
    lastMark = null;
    render();
    $('#sheet').scrollTop = 0;
    scrollHint();
    say(`${i + 1}번 홀, 파 ${state.holes[i].par}`);
  }

  let menuReturn = null;
  function openMenu(from) {
    menuReturn = from;
    $('#scrim').hidden = false;
    $('#menu-sheet').hidden = false;
    $('.menu-close').focus();
  }
  function closeMenu() {
    $('#scrim').hidden = true;
    $('#menu-sheet').hidden = true;
    if (menuReturn) menuReturn.focus();
  }

  document.addEventListener('click', (e) => {
    const b = e.target.closest('button, [data-act]');
    if (!b || b.getAttribute('aria-disabled') === 'true') return;
    const act = b.dataset.act;
    if (b.dataset.add) return edit((h) => { if (strokes(h) >= MAX) return false; h[b.dataset.add] += 1; }, b.dataset.add);
    if (b.dataset.sub) return edit((h) => { if (h[b.dataset.sub] <= 0) return false; h[b.dataset.sub] -= 1; }, b.dataset.sub);
    if (b.dataset.pen) {
      const k = b.dataset.pen;
      return edit((h) => { if (PENS[k].stroke && strokes(h) >= MAX) return false; h[k] += 1; h.stack.push(k); }, k);
    }
    if (act === 'undo') return edit((h) => { const k = h.stack.pop(); if (!k) return false; h[k] = Math.max(0, h[k] - 1); });
    if (b.dataset.dir) return edit((h) => { h.tee = h.tee === b.dataset.dir ? null : b.dataset.dir; });
    if (b.dataset.miss) return edit((h) => { h[b.dataset.miss] = !h[b.dataset.miss]; });
    if (b.dataset.mode) { state.mode = b.dataset.mode; render(); $('#sheet').scrollTop = 0; scrollHint(); return; }
    if (act === 'next') {
      if (state.cur < PARS.length - 1) goTo(state.cur + 1);
      else { state.view = 'card'; render(); }
      return;
    }
    if (act === 'prev') return goTo(state.cur - 1);
    if (act === 'fwd') return goTo(state.cur + 1);
    if (b.dataset.view) { state.view = b.dataset.view; render(); return; }
    if (b.dataset.open !== undefined) { state.view = 'entry'; goTo(Number(b.dataset.open)); return; }
    if (act === 'menu') return openMenu(b);
    if (act === 'close-menu') return closeMenu();
  });

  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && !$('#menu-sheet').hidden) { closeMenu(); return; }
    if ((e.key === 'ArrowLeft' || e.key === 'ArrowRight') && e.target.getAttribute('role') === 'tab') {
      state.view = state.view === 'entry' ? 'card' : 'entry';
      render();
      $(`#tab-${state.view}`).focus();
    }
  });

  $('#sheet').addEventListener('scroll', scrollHint, { passive: true });
  window.addEventListener('resize', () => { drawCourse(); scrollHint(); });
  render();
})();
</script>
</body>
</html>

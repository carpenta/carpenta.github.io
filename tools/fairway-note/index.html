<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="에버리스 동코스 라운드에서 홀마다 드라이버·어프로치·퍼트·OB·멀리건을 탭으로 세고 합계와 분석을 보는 스코어 노트." />
    <meta name="referrer" content="no-referrer" />
    <meta name="theme-color" content="#1f5a3a" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; connect-src 'none'; img-src 'self' data:; style-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Fairway Note" />
    <meta name="format-detection" content="telephone=no" />
    <title>Fairway Note</title>
  </head>
  <body>
    <header class="top">
      <div class="brand">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M16.4 3 15.2 10.6" stroke="#fff" stroke-width="1.8" stroke-linecap="round"/><path d="M14.4 9.8 16.2 10.4c.6 3.3.4 6.6-.6 8.6-.8 1.6-3.6 2.2-8.4 1.6-2-.2-2.8-1.6-2.1-3l1.1-2.1c.4-.8 1.3-1.2 2.2-1 2.8.5 4.6-.4 6-4.7z" fill="#F2C94C" stroke="#fff" stroke-width="1" stroke-linejoin="round"/><path d="M7.4 16.4h6.6M7 17.9h7.1M7.2 19.3h6.6" stroke="#1F5A3A" stroke-width=".55" stroke-linecap="round" opacity=".5"/></svg>
        <div>
          <h1 class="app-name">Fairway Note</h1>
          <p id="course-name" class="course-name">에버리스 동코스</p>
        </div>
      </div>
      <a class="home-link" href="../../">carpenta.github.io</a>
    </header>

    <main>
      <section id="stale" class="stale" hidden aria-labelledby="stale-text">
        <p id="stale-text"></p>
        <div class="stale-actions">
          <button id="stale-keep" class="btn" type="button">이어서 기록</button>
          <button id="stale-new" class="btn primary" type="button">새 라운드 시작</button>
        </div>
      </section>

      <section class="summary" aria-label="라운드 합계">
        <div class="stat big"><span class="label">총타</span><b id="sum-strokes">0</b><span id="sum-topar" class="topar">E</span></div>
        <div class="stat"><span class="label">홀</span><b id="sum-holes">0/18</b></div>
        <div class="stat"><span class="label">퍼트</span><b id="sum-putts">0</b></div>
        <div class="stat"><span class="label">OB</span><b id="sum-ob">0</b></div>
        <div class="stat"><span class="label">멀리건</span><b id="sum-mulligan">0</b></div>
      </section>

      <nav class="hole-nav" aria-label="홀 선택">
        <ol id="hole-tabs"></ol>
      </nav>

      <section id="hole-card" class="hole-card" aria-labelledby="hole-title">
        <div class="hole-head">
          <h2 id="hole-title">1번 홀</h2>
          <div class="par-pick" role="radiogroup" aria-label="파">
            <button type="button" data-par="3" role="radio">Par 3</button>
            <button type="button" data-par="4" role="radio">Par 4</button>
            <button type="button" data-par="5" role="radio">Par 5</button>
          </div>
        </div>
        <p class="hole-score"><b id="hole-strokes">0</b>타 <span id="hole-topar" class="topar"></span> <span id="hole-name" class="score-name"></span></p>
        <div id="counters" class="counters"></div>
        <nav class="hole-move" aria-label="홀 이동">
          <button id="prev-hole" class="btn" type="button">◀ 이전 홀</button>
          <button id="next-hole" class="btn primary" type="button">다음 홀 ▶</button>
        </nav>
      </section>

      <section class="card" aria-labelledby="card-title">
        <h2 id="card-title">스코어카드</h2>
        <div id="scorecard"></div>
      </section>

      <section class="card" aria-labelledby="analysis-title">
        <h2 id="analysis-title">라운드 분석</h2>
        <div id="analysis"></div>
      </section>

      <section class="card" aria-labelledby="send-title">
        <h2 id="send-title">결과 보내기</h2>
        <p id="send-note" class="muted small"></p>
        <div id="send-actions" class="send-actions">
          <a id="send-email" class="btn primary" href="mailto:">이메일로 보내기</a>
          <button id="send-share" class="btn" type="button">공유하기</button>
        </div>
        <p id="send-status" class="muted small" role="status"></p>
      </section>

      <p id="announce" class="sr-only" aria-live="polite"></p>

      <section class="card footer-actions">
        <p id="save-state" class="muted"></p>
        <button id="new-round" class="btn danger" type="button">새 라운드 시작</button>
      </section>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>

name: Build and deploy
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  site:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run resume
      - run: npm run test:pdf
      - run: npm run test:e2e
      - name: Remove the résumé (tested above, not published)
        run: rm -rf dist/resume dist/en/resume
      - uses: actions/upload-artifact@v7
        with:
          name: site-dist
          path: site/dist
          if-no-files-found: error

  folio:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: tools/folio
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: tools/folio/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e -- --workers=1
      - uses: actions/upload-artifact@v7
        with:
          name: folio-dist
          path: tools/folio/dist
          if-no-files-found: error

  tabula:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: tools/tabula
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: tools/tabula/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e -- --workers=1
      - uses: actions/upload-artifact@v7
        with:
          name: tabula-dist
          path: tools/tabula/dist
          if-no-files-found: error

  # The e2e suite (about 400 tests, one at a time) had grown to about 15 of the job's 20 minutes, so it runs in four
  # shards at once, each on its own runner and still one test at a time. The first shard also runs the unit tests and
  # uploads the build; assemble waits for all four. To add a shard, add its number to the matrix.
  fairway-note:
    name: fairway-note (${{ matrix.shard }}/${{ strategy.job-total }})
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: tools/fairway-note
    steps:
      - uses: actions/checkout@v7
      # bun installs and runs the scripts; Vite, Vitest and Playwright still run on Node. Keep bun-version in step with
      # packageManager in tools/fairway-note/package.json.
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile
      - run: bun run test
        if: matrix.shard == 1
      - run: bun run build
      - run: bunx playwright install --with-deps chromium
      - run: bun run test:e2e --workers=1 --shard=${{ matrix.shard }}/${{ strategy.job-total }}
      - uses: actions/upload-artifact@v7
        if: matrix.shard == 1
        with:
          name: fairway-note-dist
          path: tools/fairway-note/dist
          if-no-files-found: error

  assemble:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [site, folio, tabula, fairway-note]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: actions/download-artifact@v8
        with:
          name: site-dist
          path: site/dist
      - uses: actions/download-artifact@v8
        with:
          name: folio-dist
          path: tools/folio/dist
      - uses: actions/download-artifact@v8
        with:
          name: tabula-dist
          path: tools/tabula/dist
      - uses: actions/download-artifact@v8
        with:
          name: fairway-note-dist
          path: tools/fairway-note/dist
      - run: node --test scripts/assemble.test.mjs
      - run: node scripts/assemble.mjs
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
    needs: assemble
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

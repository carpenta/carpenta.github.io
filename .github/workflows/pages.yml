name: Build and deploy
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  site:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run resume
      - run: npm run test:pdf
      - run: npm run test:e2e
      - name: Remove the résumé (tested above, not published)
        run: rm -rf dist/resume dist/en/resume
      - uses: actions/upload-artifact@v7
        with:
          name: site-dist
          path: site/dist
          if-no-files-found: error

  folio:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: tools/folio
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: tools/folio/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e -- --workers=1
      - uses: actions/upload-artifact@v7
        with:
          name: folio-dist
          path: tools/folio/dist
          if-no-files-found: error

  assemble:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [site, folio]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: actions/download-artifact@v8
        with:
          name: site-dist
          path: site/dist
      - uses: actions/download-artifact@v8
        with:
          name: folio-dist
          path: tools/folio/dist
      - run: node --test scripts/assemble.test.mjs
      - run: node scripts/assemble.mjs
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
    needs: assemble
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
